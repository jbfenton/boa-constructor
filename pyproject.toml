[project]
name = "boa-constructor"
version = "0.7.3"
description = "A rapid application development tool"
readme = "README.md"
requires-python = ">=3.12.4"
dependencies = [
    "wxPython==4.2.2",
]

[dependency-groups]
dev = [
    "pre-commit",
    "ruff",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
    "Debugger/BoaDebugger/BoaDebugger.py",
    "Debugger/test.py",
    "ExternalLib/Cyclops.py",
    "ExternalLib/pylint.py",
    "ExternalLib/zipfile.py",
    "Models/EditorModels.py",
    "Plug-ins/BicycleRepairMan.plug-in.py",
    "Scripts/FixPythonDocs.py",
    "ZopeLib/DateTime/DateTime.py",
    "ZopeLib/ZopeFTP.py",
    "ZopeLib/zoa",
]

[tool.ruff.lint]
ignore = [
    "E402",
    "E701",
    "E741",
    "F403",
    "F405"
]
select = [
    "E",
    "F",
    "I"
]
